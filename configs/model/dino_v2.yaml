_recursive_: false

defaults:
  - /backbone@backbone_config: vit_b_timm
  - /sensor@sensor_config: enmap
  - _self_

_target_: src.models.dino_v2.DINOv2Module

# Model head dimensions (DINOv2 uses much larger output_dim than v1)
hidden_dim: 2048
bottleneck_dim: 256
output_dim: 65536

# Training params
lr: 2.0e-4
min_lr: 1.0e-6
warmup_epochs: 20
weight_decay: 0.04
weight_decay_end: 0.4

# Multicrop params (DINOv2 uses global + local crops)
n_local_views: 6
global_crop_scale: [0.32, 1.0]
local_crop_scale: [0.05, 0.32]

# Temperature schedules
freeze_last_layer_epochs: 1
student_temp: 0.1
teacher_temp_warmup: 0.04
teacher_temp: 0.07
teacher_temp_warmup_steps: 30000

# Radiometric augmentation (applied on top of Kornia augs)
radiometric_aug_p: 0.5
