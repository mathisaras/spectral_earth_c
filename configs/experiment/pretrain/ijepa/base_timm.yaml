# @package _global_

defaults:
  - override /data: spectral_earth_mm_zarr
  - override /model: ijepa_timm
  - override /backbone@model.backbone_config: spec_vit_b
  - override /sensor@model.sensor_config: enmap
  - override /callbacks: self_supervised
  - override /trainer: ddp_ssl
  - override /logger: wandb

tags: [ "pretrain", "ijepa_timm", "enmap", "zarr_mm" ]

seed: 12345

data:
  batch_size: 32
  sensors: [ "ENMAP" ]  # Only ENMAP; batch will have key "ENMAP" (or image1/image2 if num_temporal_views=2)
  groups: null     # Use all groups that contain ENMAP
  sampling_weights: null
  num_workers: 5

model:
  # I-JEPA specific training hyperparameters
  max_epochs: 200
  warmup_epochs: 20
  lr: 0.00001
  weight_decay: 0.0001
  ema_momentum_start: 0.996
  ema_momentum_end: 1.0
  enc_mask_scale: [0.85,1.0]
  pred_mask_scale: [0.15,0.4]

trainer:
  max_epochs: ${model.max_epochs}
  precision: 16-mixed
  strategy: ddp_find_unused_parameters_true

backbone_name: spec_vit_b

task_name: ssl_pretrain/spectral_earth_mm/${sensor.name}/ijepa_timm/${backbone_name}

logger:
  wandb:
    tags: ${tags}
    group: ${task_name}
    project: ssl_pretrain_spectral_earth_mm
    offline: False
  aim:
    experiment: ${task_name}

