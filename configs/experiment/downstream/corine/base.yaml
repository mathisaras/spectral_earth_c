# @package _global_

defaults:
  - override /data: corine
  - override /sensor: enmap
  - override /sensor@data.sensor_config: enmap
  - override /model: multilabel_classif
  - override /trainer: ddp
  - override /paths: default
  - override /logger: wandb
  - override /backbone@model.backbone_config: spec_vit_s


tags: [ "downstream", "corine", "classification"]

# MultiLabelClassificationModule parameter overrides
model:
  num_classes: 19
  learning_rate: 1e-3
  weight_decay: 1e-5
  t_max: ${trainer.max_epochs}
  eta_min: 0

data:
  batch_size: 32
  root: ${paths.data_dir}/corine

trainer:
  max_epochs: 100

experiment_setup: "corine"
protocol: null
weight_init: random
backbone_name: null

task_name: downstream/${experiment_setup}/${sensor.name}/${backbone_name}/${protocol}/${weight_init}

logger:
  wandb:
    group: ${task_name}
    project: "${experiment_setup}" 