# configs/data/eurocrops.yaml
_target_: src.datamodules.eurocrops_datamodule.EurocropsDataModule

defaults:
  - /sensor@sensor_config: enmap # Defaulting to s2 for eurocrops

product: "eurocrops"
classes: [0, 3301090205, 3301010600, 3301090303, 3301010800, 3301090301, 3303060000, 3303030600, 3303050000, 3303030100, 3301060500, 3301060300, 3303010000, 3301020000, 3301160000, 3301029900]

# sensor: ${sensor}

root: ${paths.data_dir}
split_root: data/splits
apply_input_normalization: true
standardize: false
standardization_mode: bandwise
standardization_stats_path: null
standardization_eps: 1.0e-6
target_sensor_config: null
batch_size: 32

# Patch size (output image size from dataloader)
img_size: ${data.sensor_config.img_size}

num_workers: 8
