# configs/data/cdl.yaml

_target_: src.datamodules.cdl_datamodule.CDLDataModule

defaults:
  - /sensor@sensor_config: enmap # Default to enmap

product: "cdl" 
          
root: ${paths.data_dir}
split_root: data/splits
apply_input_normalization: true
standardize: false
standardization_mode: bandwise
standardization_stats_path: null
standardization_eps: 1.0e-6
target_sensor_config: null


classes: [0, 1, 2, 3, 4, 5, 6, 45, 54, 69, 72, 75, 76, 204, 210]

# Optional: if you want the dataset to return raw mask values without remapping.
raw_mask: false

# General parameters
batch_size: 32

# Patch size (output image size from dataloader) - links to sensor's patch size
img_size: ${data.sensor_config.img_size}

num_workers: 8 
train_random_resized_crop_scale: [0.4, 1.0]
