_target_: src.datamodules.gaofen5_wuhan_datamodule.Gaofen5WuhanDataModule

defaults:
  - /sensor@sensor_config: gaofen5

product: "gaofen5_wuhan"
classes: [5, 6, 11, 12, 13, 14, 21, 22, 23, 31, 32, 33, 41]
background_value: 0

# Patchify script output root. Keep it relative to the active paths profile so
# JUWELS / Terrabyte can point at different storage locations cleanly.
root: ${paths.data_dir}/wuhan_highres_128
split_root: data/splits

apply_input_normalization: true
standardize: false
standardization_mode: bandwise
standardization_stats_path: null
standardization_eps: 1.0e-6
target_sensor_config: null

batch_size: 8
img_size: 128
num_workers: 4

num_classes: 13
ignore_index: 13
